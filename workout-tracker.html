<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #6c63ff;
      --accent-dim: #4e47cc;
      --text: #f0f0f0;
      --muted: #888;
      --danger: #e05c5c;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      padding: 1rem;
    }

    header { text-align: center; padding: 1.5rem 0 1rem; }
    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    .header-sub { display: flex; justify-content: center; margin-top: 0.75rem; }

    .pill-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .pill-toggle button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.3rem 0.65rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .pill-toggle button.active { background: var(--accent); color: #fff; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
    }

    /* Log form */
    .log-date-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem; }
    .log-for-label { font-size: 0.8rem; color: var(--muted); }

    .date-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.28rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .date-pill:hover { border-color: var(--accent); }
    .date-pill.cal-open { border-color: var(--accent); color: var(--accent); }

    .ex-row { margin-bottom: 0.85rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 0.6rem 0.75rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    /* Combobox */
    .combo-wrap { position: relative; }

    .combo-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      max-height: 230px;
      overflow-y: auto;
      z-index: 200;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .combo-opt {
      padding: 0.58rem 0.85rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.1s;
    }

    .combo-opt:hover, .combo-opt.hl { background: var(--border); }

    .combo-opt.add-custom {
      color: var(--accent);
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .combo-opt.no-match { color: var(--muted); cursor: default; font-size: 0.85rem; }

    .combo-group-header {
      padding: 0.3rem 0.85rem 0.15rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      pointer-events: none;
      border-top: 1px solid var(--border);
    }

    .combo-group-header:first-child { border-top: none; }

    /* Set rows */
    .sets-section-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }

    .set-row { display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.4rem; }

    .set-num { font-size: 0.75rem; color: var(--muted); min-width: 2.8rem; flex-shrink: 0; }

    .set-row input { flex: 1; padding: 0.42rem 0.55rem; font-size: 0.9rem; }

    .remove-set-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0.2rem 0.3rem;
      border-radius: 5px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .remove-set-btn:hover { color: var(--danger); }
    .set-placeholder { width: 1.6rem; flex-shrink: 0; }

    .cardio-label { font-size: 0.75rem; color: var(--muted); min-width: 5rem; flex-shrink: 0; }
    .cardio-unit-label { font-size: 0.72rem; color: var(--muted); min-width: 2.8rem; flex-shrink: 0; }
    .cardio-tag {
      display: inline-block; font-size: 0.65rem; font-weight: 700;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-radius: 4px; padding: 0.1rem 0.35rem; margin-left: 0.35rem;
      vertical-align: middle; text-transform: uppercase; letter-spacing: 0.05em;
    }

    .add-set-btn {
      width: 100%;
      background: none;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.83rem;
      padding: 0.4rem;
      cursor: pointer;
      margin-top: 0.1rem;
      margin-bottom: 0.6rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .add-set-btn:hover { border-color: var(--accent); color: var(--accent); }

    button.primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.primary:active { background: var(--accent-dim); }

    /* Calendar */
    .calendar {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.65rem; }
    .cal-title { font-size: 0.88rem; font-weight: 600; }

    .cal-nav {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.1rem 0.35rem;
      border-radius: 5px;
      transition: background 0.12s;
    }

    .cal-nav:hover:not(:disabled) { background: var(--border); }
    .cal-nav:disabled { opacity: 0.25; cursor: default; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .cal-dow { font-size: 0.68rem; color: var(--muted); padding: 0.2rem 0; font-weight: 500; }

    .cal-day {
      position: relative;
      font-size: 0.82rem;
      padding: 0.35rem 0.1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      line-height: 1.3;
    }

    .cal-day:not(.empty):not(.future):hover { background: var(--border); }
    .cal-day.today { color: var(--accent); font-weight: 700; }
    .cal-day.selected { background: var(--accent) !important; color: #fff !important; font-weight: 700; }
    .cal-day.empty, .cal-day.future { cursor: default; }
    .cal-day.future { opacity: 0.2; }

    .cal-day.has-entries::after {
      content: '';
      position: absolute;
      bottom: 2px; left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .cal-day.selected::after { background: rgba(255,255,255,0.7); }

    /* History header */
    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .history-header h2 { margin-bottom: 0; }
    .header-actions { display: flex; align-items: center; gap: 0.5rem; }

    .cal-icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.28rem 0.5rem;
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      line-height: 1.4;
    }

    .cal-icon-btn:hover, .cal-icon-btn.active { border-color: var(--accent); color: var(--accent); }

    .filter-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .filter-row input { flex: 1; font-size: 0.9rem; padding: 0.5rem 0.75rem; }

    /* Entry display */
    .entry-list { display: flex; flex-direction: column; gap: 0.65rem; }

    .entry {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .entry-info { flex: 1; min-width: 0; }

    .entry-name {
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.3rem;
    }

    .sets-display { display: flex; flex-direction: column; gap: 0.15rem; }
    .set-line { font-size: 0.8rem; color: var(--muted); }

    .entry-time { font-size: 0.75rem; color: var(--muted); white-space: nowrap; padding-top: 0.1rem; }

    .edit-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 0.25rem; font-size: 1rem; line-height: 1;
      border-radius: 6px; transition: color 0.15s; flex-shrink: 0;
    }

    .edit-btn:hover { color: var(--accent); }

    .delete-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 0.25rem; font-size: 1.1rem; line-height: 1;
      border-radius: 6px; transition: color 0.15s; flex-shrink: 0;
    }

    .delete-btn:hover { color: var(--danger); }

    /* Inline edit / add form */
    .entry.editing { flex-direction: column; align-items: stretch; gap: 0.5rem; border-color: var(--accent); }
    .edit-ex-input { padding: 0.45rem 0.65rem; font-size: 0.9rem; }
    .edit-actions { display: flex; gap: 0.5rem; margin-top: 0.1rem; }

    .btn-save {
      flex: 1; background: var(--accent); color: #fff; border: none;
      border-radius: 7px; padding: 0.5rem; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
    }

    .btn-save:active { background: var(--accent-dim); }

    .btn-cancel {
      background: var(--border); color: var(--text); border: none;
      border-radius: 7px; padding: 0.5rem 0.85rem; font-size: 0.88rem; cursor: pointer;
    }

    /* Date-grouped view */
    .date-group { margin-bottom: 0.5rem; }

    .date-header {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.55rem 0.5rem; cursor: pointer; user-select: none;
      border-radius: 8px; transition: background 0.12s;
    }

    .date-header:hover { background: var(--border); }

    .date-chevron { color: var(--muted); font-size: 0.65rem; transition: transform 0.2s; flex-shrink: 0; }
    .date-chevron.open { transform: rotate(90deg); }
    .date-label { font-weight: 600; font-size: 0.92rem; flex: 1; }
    .date-count { font-size: 0.75rem; color: var(--muted); }
    .date-entries { display: flex; flex-direction: column; gap: 0.5rem; padding-bottom: 0.5rem; }

    .date-add-btn {
      width: 100%; background: none; border: 1px dashed var(--border);
      border-radius: 8px; color: var(--muted); font-size: 0.85rem;
      padding: 0.55rem; cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }

    .date-add-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* PR badge */
    .pr-badge {
      display: inline-block; font-size: 0.6rem; font-weight: 800;
      color: #b8860b; background: rgba(218,165,32,0.14);
      border-radius: 4px; padding: 0.07rem 0.32rem; margin-left: 0.35rem;
      vertical-align: middle; text-transform: uppercase; letter-spacing: 0.04em;
    }

    /* PR view */
    .pr-section { margin-bottom: 0.9rem; }
    .pr-section-header {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--accent);
      padding: 0.2rem 0 0.3rem; border-bottom: 1px solid var(--border);
      margin-bottom: 0.25rem;
    }
    .pr-row {
      display: flex; align-items: baseline; gap: 0.45rem;
      padding: 0.38rem 0.2rem; border-bottom: 1px solid var(--border);
      font-size: 0.86rem;
    }
    .pr-row:last-child { border-bottom: none; }
    .pr-exercise { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pr-weight { font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .pr-reps { color: var(--muted); font-size: 0.78rem; flex-shrink: 0; }
    .pr-date { color: var(--muted); font-size: 0.72rem; flex-shrink: 0; margin-left: auto; padding-left: 0.4rem; }

    /* Body weight card */
    .bw-log-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem; }
    .bw-weight-input { flex: 1; padding: 0.38rem 0.6rem; font-size: 0.95rem; }
    .bw-log-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 7px; padding: 0.42rem 0.85rem; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; transition: background 0.15s; flex-shrink: 0;
    }
    .bw-log-btn:active { background: var(--accent-dim); }
    #bw-chart { width: 100%; display: block; }
    .bw-entry-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.42rem 0.2rem; border-bottom: 1px solid var(--border); font-size: 0.86rem;
    }
    .bw-entry-row:last-child { border-bottom: none; }
    .bw-entry-date { flex: 1; color: var(--muted); font-size: 0.8rem; }
    .bw-entry-weight { font-weight: 600; }

    /* Session bar */
    #session-bar {
      display: flex; align-items: center; gap: 0.5rem;
      background: color-mix(in srgb, var(--accent) 8%, transparent); border: 1px solid var(--accent);
      border-radius: 8px; padding: 0.5rem 0.75rem; margin-bottom: 0.75rem;
    }
    .session-info { flex: 1; min-width: 0; }
    .session-name {
      font-size: 0.68rem; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.06em; display: block;
    }
    .session-exercise {
      font-size: 0.9rem; font-weight: 600; display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-progress {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem;
    }
    .session-progress-track {
      flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .session-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }
    .session-progress-label { flex-shrink: 0; }
    .session-btns { display: flex; gap: 0.35rem; flex-shrink: 0; }
    .session-skip {
      background: none; border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 0.25rem 0.55rem; font-size: 0.78rem; cursor: pointer;
    }
    .session-stop {
      background: none; border: none; color: var(--muted);
      font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0.2rem; border-radius: 5px;
    }
    .session-stop:hover { color: var(--danger); }

    /* Templates */
    .tmpl-header-row {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;
    }
    .tmpl-header-row h2 { margin-bottom: 0; }
    .template-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.75rem 0.85rem; margin-bottom: 0.5rem;
    }
    .template-card:last-child { margin-bottom: 0; }
    .template-card-top { display: flex; align-items: center; margin-bottom: 0.4rem; gap: 0.5rem; }
    .template-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
    .template-actions { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
    .template-exercises { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .exercise-pill {
      background: var(--border); color: var(--muted); font-size: 0.71rem;
      border-radius: 20px; padding: 0.16rem 0.5rem; display: inline-flex;
      align-items: center; gap: 0.2rem;
    }
    .pill-remove {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.65rem; line-height: 1; padding: 0; margin-left: 0.1rem;
    }
    .pill-remove:hover { color: var(--danger); }
    .tmpl-name-input { width: 100%; margin-bottom: 0.5rem; }
    .tmpl-ex-row { display: flex; gap: 0.5rem; margin-bottom: 0.4rem; }
    .btn-start {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 0.28rem 0.65rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-start:active { background: var(--accent-dim); }
    .tmpl-builder { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem; margin-bottom: 0.75rem; }
    .builder-ex-list { display: flex; flex-wrap: wrap; gap: 0.3rem; min-height: 2rem; margin: 0.4rem 0 0.6rem; }
    .builder-empty { font-size: 0.78rem; color: var(--muted); padding: 0.2rem 0; }
    .tmpl-builder-actions { display: flex; gap: 0.5rem; margin-top: 0.25rem; }

    /* Stats card */
    .stat-group { margin-bottom: 1rem; }
    .stat-group:last-child { margin-bottom: 0; }
    .stat-group-title {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.5rem;
    }
    .stat-week-label {
      font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 0.35rem;
    }
    .streak-row { display: flex; gap: 0.65rem; }
    .streak-box {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.6rem 0.5rem; text-align: center;
    }
    .streak-num { font-size: 1.5rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
    .streak-lbl { font-size: 0.7rem; color: var(--muted); margin-top: 0.1rem; }
    .vol-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
    .vol-label { min-width: 6rem; flex-shrink: 0; font-size: 0.78rem; }
    .vol-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .vol-bar { height: 100%; background: var(--accent); border-radius: 3px; }
    .vol-val { flex-shrink: 0; font-size: 0.75rem; color: var(--muted); min-width: 4rem; text-align: right; }
    .activity-cal { margin-top: 0.25rem; }
    .activity-dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 3px; }
    .activity-dow span { font-size: 0.58rem; color: var(--muted); text-align: center; }
    .activity-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .ac { aspect-ratio: 1; border-radius: 2px; background: var(--border); }
    .ac-on { background: var(--accent); opacity: 0.85; }
    .ac-today { box-shadow: 0 0 0 1.5px var(--accent); opacity: 1; }
    .ac-future { opacity: 0.12; }

    .day-notes { margin-top: 0.25rem; }

    .day-notes-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.55rem 0.75rem;
      resize: vertical;
      min-height: 3.6rem;
      outline: none;
      transition: border-color 0.15s;
      display: block;
    }

    .day-notes-textarea:focus { border-color: var(--accent); }
    .day-notes-textarea::placeholder { color: var(--muted); }

    /* Progress view */
    .progress-picker-row { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.85rem; }
    .progress-picker-label { font-size: 0.8rem; color: var(--muted); flex-shrink: 0; }

    .progress-select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 0.5rem 0.65rem;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .progress-select:focus { border-color: var(--accent); }

    .progress-stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.85rem; }

    .progress-stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.5rem;
      text-align: center;
    }

    .progress-stat-value { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
    .progress-stat-label { font-size: 0.7rem; color: var(--muted); margin-top: 0.1rem; }

    #progress-chart { width: 100%; height: 200px; display: block; }

    /* Misc */
    .empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 2rem 0; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.65rem; margin-bottom: 1.25rem; }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem;
      text-align: center;
    }

    .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }

    .badge {
      display: inline-block;
      background: var(--accent); color: #fff;
      font-size: 0.7rem; font-weight: 700;
      border-radius: 20px; padding: 0.1rem 0.5rem;
      margin-left: 0.4rem; vertical-align: middle;
    }

    @media (min-width: 480px) { body { max-width: 480px; margin: 0 auto; } }

    /* Theme card */
    .theme-presets { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .theme-swatch {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; border: 2px solid transparent; border-radius: 10px;
      padding: 0.28rem 0.28rem 0.22rem; transition: border-color 0.15s; user-select: none;
    }
    .theme-swatch:hover { border-color: var(--border); }
    .theme-swatch.active { border-color: var(--accent); }
    .swatch-preview {
      width: 50px; height: 33px; border-radius: 5px; position: relative; overflow: hidden;
      border: 1px solid rgba(128,128,128,0.18);
    }
    .swatch-surface { position: absolute; top: 4px; left: 4px; right: 4px; bottom: 9px; border-radius: 2px; }
    .swatch-accent  { position: absolute; bottom: 0; left: 0; right: 0; height: 7px; }
    .swatch-name    { font-size: 0.62rem; color: var(--muted); margin-top: 0.22rem; }
    .theme-custom-pickers { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.75rem; }
    .color-pick-row { display: flex; align-items: center; gap: 0.65rem; }
    .color-pick-row label { flex: 1; font-size: 0.85rem; color: var(--text); margin-bottom: 0; }
    input[type="color"] {
      width: 42px; height: 30px; border: 1px solid var(--border); border-radius: 6px;
      padding: 2px 3px; background: var(--bg); cursor: pointer; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Workout Tracker</h1>
    <p id="today-date"></p>
    <div class="header-sub">
      <div class="pill-toggle">
        <button id="btn-kg" onclick="setUnit('kg')">kg</button>
        <button id="btn-lbs" onclick="setUnit('lbs')">lbs</button>
      </div>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Entries</div></div>
    <div class="stat"><div class="stat-value" id="stat-today">0</div><div class="stat-label">Today</div></div>
    <div class="stat"><div class="stat-value" id="stat-exercises">0</div><div class="stat-label">Exercises</div></div>
  </div>

  <div class="card">
    <h2>Appearance</h2>
    <div id="theme-content"></div>
  </div>

  <div class="card">
    <h2>Log Exercise</h2>
    <div id="session-bar" style="display:none"></div>
    <div class="log-date-row">
      <span class="log-for-label">For</span>
      <button class="date-pill" id="log-date-btn" onclick="toggleCal('log')">Today ▾</button>
    </div>
    <div id="log-cal"></div>
    <div class="ex-row">
      <label for="exercise">Exercise</label>
      <div class="combo-wrap">
        <input id="exercise" type="text" placeholder="Search or type exercise…" autocomplete="off"
               onfocus="comboFocus('exercise')"
               oninput="comboInput('exercise')"
               onblur="comboBlur('exercise')"
               onkeydown="comboKeydown(event,'exercise')" />
        <div id="exercise-dd" class="combo-dropdown"></div>
      </div>
    </div>
    <div id="form-dynamic-section"></div>
    <button class="primary" onclick="addEntry()">Log Exercise</button>
  </div>

  <div class="card">
    <div id="templates-content"></div>
  </div>

  <div class="card">
    <div class="history-header">
      <h2>History <span class="badge" id="count-badge">0</span></h2>
      <div class="header-actions">
        <button class="cal-icon-btn" id="browse-cal-btn" onclick="toggleCal('browse')" title="Browse by calendar">&#128197;</button>
        <div class="pill-toggle">
          <button id="btn-list" class="active" onclick="setView('list')">List</button>
          <button id="btn-date" onclick="setView('date')">By Date</button>
          <button id="btn-progress" onclick="setView('progress')">Progress</button>
          <button id="btn-prs" onclick="setView('prs')">PRs</button>
        </div>
      </div>
    </div>
    <div id="browse-cal"></div>
    <div class="filter-row" id="filter-row">
      <input id="search" type="text" placeholder="Search exercises…" oninput="render()" />
    </div>
    <div class="entry-list" id="entry-list"></div>

    <!-- PR view (hidden unless currentView === 'prs') -->
    <div id="pr-view" style="display:none"></div>

    <!-- Progress view (hidden unless currentView === 'progress') -->
    <div id="progress-view" style="display:none">
      <div class="progress-picker-row">
        <span class="progress-picker-label">Exercise</span>
        <select id="progress-exercise" class="progress-select" onchange="setProgressExercise(this.value)">
          <option value="">— Select an exercise —</option>
        </select>
      </div>
      <div id="progress-stats-row" class="progress-stats-row" style="display:none"></div>
      <canvas id="progress-chart" style="display:none"></canvas>
      <div id="progress-empty" class="empty">Select an exercise to see its progress.</div>
    </div>
  </div>

  <div class="card">
    <h2>Body Weight</h2>
    <div class="bw-log-row">
      <span class="log-for-label">For</span>
      <button class="date-pill" id="bw-date-btn" onclick="toggleCal('bw')">Today ▾</button>
      <input id="bw-input" type="number" placeholder="kg" min="1" step="0.1" class="bw-weight-input" />
      <button class="bw-log-btn" onclick="addBWEntry()">Log</button>
    </div>
    <div id="bw-cal"></div>
    <canvas id="bw-chart" style="display:none"></canvas>
    <div id="bw-list"></div>
  </div>

  <div class="card">
    <h2>Stats</h2>
    <div id="stats-content"></div>
  </div>

  <script>
    // ── Constants ─────────────────────────────────────────────────────────────

    const KEY           = 'wt_entries';
    const UNIT_KEY      = 'wt_unit';
    const CUSTOM_KEY    = 'wt_custom';
    const NOTES_KEY     = 'wt_notes';
    const BW_KEY        = 'wt_bw';
    const TEMPLATES_KEY = 'wt_templates';
    const THEME_KEY     = 'wt_theme';

    const PRESETS = [
      { id:'void',  name:'Void',  bg:'#0f0f0f', surface:'#1a1a1a', border:'#2a2a2a', text:'#f0f0f0', muted:'#888888', accent:'#6c63ff', accentDim:'#4e47cc' },
      { id:'light', name:'Light', bg:'#f4f4f5', surface:'#ffffff', border:'#e4e4e7', text:'#18181b', muted:'#71717a', accent:'#6c63ff', accentDim:'#4e47cc' },
      { id:'ocean', name:'Ocean', bg:'#0a0f1e', surface:'#111827', border:'#1e2a3b', text:'#e0f0ff', muted:'#6b8099', accent:'#38bdf8', accentDim:'#0ea5e9' },
      { id:'ember', name:'Ember', bg:'#0f0a09', surface:'#1c1210', border:'#2e1e1a', text:'#fef3ee', muted:'#9a7c76', accent:'#f97316', accentDim:'#c75a0b' },
      { id:'sage',  name:'Sage',  bg:'#0b110d', surface:'#131a15', border:'#1d2b20', text:'#eaf3eb', muted:'#708c76', accent:'#4ade80', accentDim:'#22c55e' },
      { id:'nord',  name:'Nord',  bg:'#2e3440', surface:'#3b4252', border:'#434c5e', text:'#eceff4', muted:'#8897b0', accent:'#88c0d0', accentDim:'#5e9fb5' },
    ];

    // ── Color helpers ─────────────────────────────────────────────────────────

    function hexToRgb(h) {
      h = h.trim();
      return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    }
    function rgbToHex(r,g,b) {
      return '#'+[r,g,b].map(v=>Math.min(255,Math.max(0,Math.round(v))).toString(16).padStart(2,'0')).join('');
    }
    function blendHex(c1,c2,t) {
      const [r1,g1,b1]=hexToRgb(c1),[r2,g2,b2]=hexToRgb(c2);
      return rgbToHex(r1+(r2-r1)*t, g1+(g2-g1)*t, b1+(b2-b1)*t);
    }
    function darkenHex(hex, amount) {
      const [r,g,b]=hexToRgb(hex);
      return rgbToHex(r*(1-amount), g*(1-amount), b*(1-amount));
    }
    function accentAlpha(alpha) {
      const [r,g,b] = hexToRgb(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim());
      return `rgba(${r},${g},${b},${alpha})`;
    }

    const EXERCISE_CATEGORIES = [
      { label: 'Chest', exercises: [
        'Incline Smith Machine Press','Flat Barbell Bench Press','Flat Dumbbell Bench Press',
        'Incline Dumbbell Press','Peck Deck','Cable Crossover (High to Low)',
        'Cable Crossover (Low to High)','Chest Dip','Push-Up',
      ]},
      { label: 'Shoulders', exercises: [
        'Machine Shoulder Press','Standing Overhead Barbell Press','Seated Dumbbell Shoulder Press',
        'Cable Lateral Raise','Dumbbell Lateral Raise','Rear Delt Fly (Machine or Cable)',
        'Front Raise','Arnold Press',
      ]},
      { label: 'Triceps', exercises: [
        'Single-Arm Tricep Extension (Cable)','Overhead Tricep Extension','Tricep Rope Pushdown',
        'Skull Crusher (EZ Bar)','Close-Grip Bench Press','Tricep Dip',
      ]},
      { label: 'Back', exercises: [
        'MAG Grip Lat Pulldown','High Row (Chest-Supported)','Machine Row','Seated Cable Row',
        'Straight-Arm Pulldown','Barbell Row','Pull-Up / Chin-Up','Single-Arm Dumbbell Row',
      ]},
      { label: 'Biceps / Forearms', exercises: [
        'Incline Dumbbell Curl','Bayesian Curl (Cable)','Spider Curl','Hammer Curl',
        'EZ Bar Forearm Extension (Reverse Curl)','Preacher Curl','Concentration Curl',
      ]},
      { label: 'Legs (Quads/Glutes)', exercises: [
        'Pendulum Squat','Barbell Back Squat','Leg Extension','Bulgarian Split Squat','Leg Press',
      ]},
      { label: 'Legs (Hamstrings/Glutes)', exercises: [
        'Olympic Bar RDL','Leg Curl (Seated or Lying)','Hip Thrust',
      ]},
      { label: 'Calves', exercises: [
        'Seated Calf Raise','Standing Calf Raise',
      ]},
      { label: 'Hips/Adductors', exercises: [
        'Hip Adductor Machine','Hip Abductor Machine',
      ]},
      { label: 'Core', exercises: [
        'Weighted Crunch','Hanging Leg Raise',
      ]},
      { label: 'Cardio', exercises: [
        'Treadmill','Stationary Bike','Outdoor Run','Outdoor Bike',
      ]},
    ];

    const CARDIO_FIELDS = {
      'Treadmill':       ['time', 'speed', 'incline'],
      'Stationary Bike': ['time', 'distance'],
      'Outdoor Run':     ['time', 'distance'],
      'Outdoor Bike':    ['time', 'distance'],
    };

    // ── State ─────────────────────────────────────────────────────────────────

    let currentView  = 'list';
    let editingId    = null;
    let addingToDate = null;
    const openDates  = new Set();

    let unit            = localStorage.getItem(UNIT_KEY) || 'kg';
    let logDate         = null;
    let calendarOpen    = '';
    let logCalMonth     = (() => { const d = new Date(); d.setDate(1); return d; })();
    let browseCalMonth  = (() => { const d = new Date(); d.setDate(1); return d; })();

    let formSets    = [{ reps: '', weight: '' }];
    let editFormSets = [];
    let addFormSets  = [{ reps: '', weight: '' }];

    let formExerciseType    = 'strength';
    let formCardio          = { incline: '', speed: '', distance: '', time: '' };
    let editFormCardio      = { incline: '', speed: '', distance: '', time: '' };
    let addFormExerciseType = 'strength';
    let addFormExercise     = '';
    let addFormCardio       = { incline: '', speed: '', distance: '', time: '' };

    let selectedProgressExercise = '';

    let bwEntries = (() => {
      try { return JSON.parse(localStorage.getItem(BW_KEY)) || []; }
      catch { return []; }
    })();
    let bwLogDate   = null;
    let bwCalMonth  = (() => { const d = new Date(); d.setDate(1); return d; })();

    let customExercises = (() => {
      try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; }
      catch { return []; }
    })();

    let dayNotes = (() => {
      try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; }
      catch { return {}; }
    })();

    let currentTheme = (() => {
      try { return JSON.parse(localStorage.getItem(THEME_KEY)) || { id: 'void' }; }
      catch { return { id: 'void' }; }
    })();

    let templates = (() => {
      try { return JSON.parse(localStorage.getItem(TEMPLATES_KEY)) || []; }
      catch { return []; }
    })();

    let activeSession   = null; // { name, exercises:[], index }
    let builderOpen     = false;
    let builderExercises = [];

    function saveNote(dateStr, text) {
      if (text.trim()) dayNotes[dateStr] = text;
      else delete dayNotes[dateStr];
      localStorage.setItem(NOTES_KEY, JSON.stringify(dayNotes));
    }

    // Combobox state keyed by input ID
    const comboStates = {};
    function getComboState(id) {
      if (!comboStates[id]) comboStates[id] = { visible: false, hl: -1 };
      return comboStates[id];
    }

    // ── Storage ───────────────────────────────────────────────────────────────

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }

    function save(entries) { localStorage.setItem(KEY, JSON.stringify(entries)); }

    // ── Backward-compat: old entries had {sets:N, reps:N, weight:N} ───────────

    function normalizeEntry(e) {
      if (e.cardio) return e;
      if (Array.isArray(e.sets)) return e;
      return { ...e, sets: [{ reps: e.reps ?? 0, weight: e.weight ?? null }] };
    }

    // ── Weight unit ───────────────────────────────────────────────────────────

    function displayWeight(kg) {
      if (kg == null) return '';
      if (unit === 'lbs') return (Math.round(kg * 2.20462 * 10) / 10) + ' lbs';
      return (Number.isInteger(kg) ? kg : Math.round(kg * 10) / 10) + ' kg';
    }

    function displayWeightShort(kg) {
      if (kg == null) return '0';
      if (unit === 'lbs') return String(Math.round(kg * 2.20462));
      return String(Number.isInteger(kg) ? kg : Math.round(kg * 10) / 10);
    }

    function inputToKg(val) {
      if (val == null || isNaN(val)) return null;
      if (unit === 'lbs') return Math.round(val / 2.20462 * 100) / 100;
      return val;
    }

    function kgToInput(kg) {
      if (kg == null) return '';
      if (unit === 'lbs') return Math.round(kg * 2.20462 * 10) / 10;
      return kg;
    }

    // ── PR detection ─────────────────────────────────────────────────────────

    function flagPRs(sets, exercise, priorEntries) {
      const best = new Map(); // reps → best kg
      for (const e of priorEntries) {
        if (e.cardio || e.exercise !== exercise) continue;
        for (const s of normalizeEntry(e).sets) {
          if (s.weight == null) continue;
          if ((best.get(s.reps) ?? -Infinity) < s.weight) best.set(s.reps, s.weight);
        }
      }
      return sets.map(s => {
        if (s.weight == null) return s;
        const prev = best.get(s.reps) ?? -Infinity;
        return s.weight > prev ? { ...s, pr: true } : s;
      });
    }

    function getExerciseCategory(name) {
      for (const cat of EXERCISE_CATEGORIES) {
        if (cat.exercises.includes(name)) return cat.label;
      }
      return 'Custom';
    }

    function renderPRView() {
      const el = document.getElementById('pr-view');
      if (!el) return;
      const all = load().filter(e => !e.cardio);
      if (!all.length) { el.innerHTML = '<div class="empty">No strength entries yet.</div>'; return; }

      const best = new Map(); // exercise → { weight, reps, ts }
      for (const e of all) {
        for (const s of normalizeEntry(e).sets) {
          if (s.weight == null) continue;
          const prev = best.get(e.exercise);
          if (!prev || s.weight > prev.weight)
            best.set(e.exercise, { weight: s.weight, reps: s.reps, ts: e.ts });
        }
      }
      if (!best.size) { el.innerHTML = '<div class="empty">No weight data logged yet.</div>'; return; }

      const grouped = new Map();
      for (const [exercise, pr] of best) {
        const cat = getExerciseCategory(exercise);
        if (!grouped.has(cat)) grouped.set(cat, []);
        grouped.get(cat).push({ exercise, pr });
      }
      for (const items of grouped.values()) items.sort((a, b) => a.exercise.localeCompare(b.exercise));

      const catOrder = [...EXERCISE_CATEGORIES.map(c => c.label), 'Custom'];
      const sorted = [...grouped.entries()].sort((a, b) => {
        const ai = catOrder.indexOf(a[0]), bi = catOrder.indexOf(b[0]);
        return (ai < 0 ? 999 : ai) - (bi < 0 ? 999 : bi);
      });

      el.innerHTML = sorted.map(([cat, items]) => `
        <div class="pr-section">
          <div class="pr-section-header">${escHtml(cat)}</div>
          ${items.map(({ exercise, pr }) => `
            <div class="pr-row">
              <span class="pr-exercise">${escHtml(exercise)}</span>
              <span class="pr-weight">${displayWeight(pr.weight)}</span>
              <span class="pr-reps">× ${pr.reps} reps</span>
              <span class="pr-date">${new Date(pr.ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: '2-digit' })}</span>
            </div>`).join('')}
        </div>`).join('');
    }

    // ── Body weight ───────────────────────────────────────────────────────────

    function saveBW() { localStorage.setItem(BW_KEY, JSON.stringify(bwEntries)); }

    function addBWEntry() {
      const val = parseFloat(document.getElementById('bw-input').value);
      if (isNaN(val) || val <= 0) return shakeEl(document.getElementById('bw-input'));
      const ts = bwLogDate
        ? (() => { const d = new Date(bwLogDate); d.setHours(12,0,0,0); return d.getTime(); })()
        : Date.now();
      bwEntries.push({ id: Date.now(), weight: inputToKg(val), ts });
      bwEntries.sort((a, b) => a.ts - b.ts);
      saveBW();
      document.getElementById('bw-input').value = '';
      renderBWSection();
    }

    function deleteBWEntry(id) {
      bwEntries = bwEntries.filter(e => e.id !== id);
      saveBW();
      renderBWSection();
    }

    function updateBWDateBtn() {
      const btn = document.getElementById('bw-date-btn');
      if (!btn) return;
      if (!bwLogDate) { btn.textContent = 'Today ▾'; return; }
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const ldStart = new Date(bwLogDate); ldStart.setHours(0,0,0,0);
      const yest = new Date(todayStart); yest.setDate(todayStart.getDate()-1);
      btn.textContent = ldStart.getTime() === yest.getTime()
        ? 'Yesterday ▾'
        : bwLogDate.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ▾';
    }

    function drawBWChart() {
      const canvas = document.getElementById('bw-chart');
      if (!canvas) return;
      if (!bwEntries.length) { canvas.style.display = 'none'; return; }

      const W = canvas.parentElement?.clientWidth || 360;
      const H = 160;
      canvas.width = W; canvas.height = H;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const byDate = new Map();
      for (const e of bwEntries) byDate.set(new Date(e.ts).toDateString(), { ts: e.ts, w: e.weight });
      const pts = [...byDate.values()].sort((a, b) => a.ts - b.ts);
      if (!pts.length) { canvas.style.display = 'none'; return; }

      const PAD = { top: 14, right: 14, bottom: 36, left: 48 };
      const cW = W - PAD.left - PAD.right, cH = H - PAD.top - PAD.bottom;
      const ws = pts.map(p => p.w);
      const minW = Math.min(...ws), maxW = Math.max(...ws);
      const spread = maxW - minW || maxW * 0.05 || 5;
      const yMin = Math.max(0, minW - spread * 0.3), yMax = maxW + spread * 0.3;
      const xOf = i => PAD.left + (pts.length === 1 ? cW/2 : i/(pts.length-1)*cW);
      const yOf = v => PAD.top + cH * (1 - (v - yMin) / (yMax - yMin));
      const _cs = getComputedStyle(document.documentElement);
      const C = { border: _cs.getPropertyValue('--border').trim(), accent: _cs.getPropertyValue('--accent').trim(), muted: _cs.getPropertyValue('--muted').trim(), bg: _cs.getPropertyValue('--bg').trim() };

      ctx.setLineDash([3,4]); ctx.strokeStyle = C.border; ctx.lineWidth = 1;
      for (let t = 0; t <= 4; t++) {
        const y = PAD.top + (t/4)*cH, val = yMax - (t/4)*(yMax-yMin);
        ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(W-PAD.right, y); ctx.stroke();
        ctx.fillStyle = C.muted; ctx.font = '10px -apple-system,sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(displayWeightShort(val), PAD.left-5, y);
      }
      ctx.setLineDash([]);
      ctx.save(); ctx.translate(9, PAD.top+cH/2); ctx.rotate(-Math.PI/2);
      ctx.fillStyle = C.muted; ctx.font = '10px -apple-system,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(unit,0,0); ctx.restore();

      const grad = ctx.createLinearGradient(0, PAD.top, 0, PAD.top+cH);
      grad.addColorStop(0, accentAlpha(0.22)); grad.addColorStop(1, accentAlpha(0));
      ctx.fillStyle = grad; ctx.beginPath();
      pts.forEach((p,i) => i===0 ? ctx.moveTo(xOf(i),yOf(p.w)) : ctx.lineTo(xOf(i),yOf(p.w)));
      ctx.lineTo(xOf(pts.length-1),PAD.top+cH); ctx.lineTo(xOf(0),PAD.top+cH); ctx.closePath(); ctx.fill();

      ctx.strokeStyle = C.accent; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      pts.forEach((p,i) => i===0 ? ctx.moveTo(xOf(i),yOf(p.w)) : ctx.lineTo(xOf(i),yOf(p.w)));
      ctx.stroke();

      pts.forEach((p,i) => {
        ctx.beginPath(); ctx.arc(xOf(i),yOf(p.w),4,0,Math.PI*2); ctx.fillStyle=C.accent; ctx.fill();
        ctx.beginPath(); ctx.arc(xOf(i),yOf(p.w),2,0,Math.PI*2); ctx.fillStyle=C.bg; ctx.fill();
      });

      const shown = new Set(), step = Math.max(1, Math.floor(pts.length/6));
      for (let i = 0; i < pts.length; i += step) shown.add(i);
      shown.add(pts.length-1);
      ctx.fillStyle = C.muted; ctx.font = '10px -apple-system,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      shown.forEach(i => ctx.fillText(
        new Date(pts[i].ts).toLocaleDateString([], { month:'short', day:'numeric' }),
        xOf(i), H-PAD.bottom+6));

    // ── Cardio unit helpers ───────────────────────────────────────────────────

    function isCardioExercise(name) { return !!CARDIO_FIELDS[name]; }
    function distUnit() { return unit === 'lbs' ? 'mi' : 'km'; }
    function spdUnit()  { return unit === 'lbs' ? 'mph' : 'km/h'; }

    function displayDistance(km) {
      if (km == null) return '';
      if (unit === 'lbs') return (Math.round(km / 1.60934 * 10) / 10) + ' mi';
      return (Math.round(km * 10) / 10) + ' km';
    }

    function displaySpeed(kmh) {
      if (kmh == null) return '';
      if (unit === 'lbs') return (Math.round(kmh / 1.60934 * 10) / 10) + ' mph';
      return (Math.round(kmh * 10) / 10) + ' km/h';
    }

    function inputToKm(val) {
      const n = parseFloat(val);
      if (isNaN(n)) return null;
      return unit === 'lbs' ? Math.round(n * 1.60934 * 100) / 100 : n;
    }

    function kmToInput(km) {
      if (km == null) return '';
      return unit === 'lbs' ? Math.round(km / 1.60934 * 10) / 10 : (Math.round(km * 10) / 10);
    }

    // ── Cardio form helpers ───────────────────────────────────────────────────

    function cardioRow(label, unitLabel, field, value, stateVarName) {
      return `<div class="set-row">
        <span class="cardio-label">${label}</span>
        <input type="number" class="cardio-input" placeholder="${unitLabel}"
               value="${escHtml(String(value ?? ''))}" min="0" step="0.1"
               oninput="${stateVarName}['${field}']=this.value" />
        <span class="cardio-unit-label">${unitLabel}</span>
      </div>`;
    }

    function cardioFormHtml(exercise, stateObj, stateVarName) {
      const fields = CARDIO_FIELDS[exercise] || [];
      if (!fields.length) return '';
      let html = '';
      if (fields.includes('time'))     html += cardioRow('Time',     'min',      'time',     stateObj.time,     stateVarName);
      if (fields.includes('distance')) html += cardioRow('Distance', distUnit(), 'distance', stateObj.distance, stateVarName);
      if (fields.includes('speed'))    html += cardioRow('Speed',    spdUnit(),  'speed',    stateObj.speed,    stateVarName);
      if (fields.includes('incline'))  html += cardioRow('Incline',  '%',        'incline',  stateObj.incline,  stateVarName);
      return html;
    }

    function parseCardioFields(stateObj, exercise) {
      const fields = CARDIO_FIELDS[exercise] || [];
      const result = {};
      if (fields.includes('time')) {
        const v = parseFloat(stateObj.time);
        result.time = isNaN(v) || v <= 0 ? null : v;
      }
      if (fields.includes('distance')) {
        const v = parseFloat(stateObj.distance);
        result.distance = isNaN(v) ? null : inputToKm(v);
      }
      if (fields.includes('speed')) {
        const v = parseFloat(stateObj.speed);
        result.speed = isNaN(v) ? null : inputToKm(v);
      }
      if (fields.includes('incline')) {
        const v = parseFloat(stateObj.incline);
        result.incline = isNaN(v) ? null : v;
      }
      const hasAny = Object.values(result).some(v => v != null);
      if (!hasAny) {
        const el = document.querySelector('.cardio-input');
        if (el) shakeEl(el);
        return null;
      }
      return result;
    }

    function renderFormSection() {
      const el = document.getElementById('form-dynamic-section');
      if (!el) return;
      if (formExerciseType === 'cardio') {
        const exercise = document.getElementById('exercise')?.value.trim() ?? '';
        el.innerHTML = cardioFormHtml(exercise, formCardio, 'formCardio');
      } else {
        el.innerHTML = `<div class="sets-section-label">Sets</div>
          <div id="sets-container"></div>
          <button class="add-set-btn" onclick="addFormSet()">+ Add Set</button>`;
        renderFormSets();
      }
    }

    function setUnit(u) {
      unit = u;
      localStorage.setItem(UNIT_KEY, u);
      document.getElementById('btn-kg').classList.toggle('active', u === 'kg');
      document.getElementById('btn-lbs').classList.toggle('active', u === 'lbs');
      renderFormSection();
      renderBWSection();

    // ── Exercise list ─────────────────────────────────────────────────────────

    function allExercises() {
      const presets = EXERCISE_CATEGORIES.flatMap(c => c.exercises);
      return [...new Set([...presets, ...customExercises])];
    }

    function filteredExercises(query) {
      const q = query.trim().toLowerCase();
      if (q) return allExercises().filter(e => e.toLowerCase().includes(q));
      // No query: custom first, then category order (deduped)
      const presetSet = new Set(EXERCISE_CATEGORIES.flatMap(c => c.exercises));
      return [...customExercises.filter(c => !presetSet.has(c)),
              ...EXERCISE_CATEGORIES.flatMap(c => c.exercises)];
    }

    // ── Combobox ──────────────────────────────────────────────────────────────

    function comboFocus(id) {
      const s = getComboState(id);
      s.visible = true;
      s.hl = -1;
      renderComboDropdown(id);
    }

    function comboInput(id) {
      const s = getComboState(id);
      s.visible = true;
      s.hl = -1;
      renderComboDropdown(id);
      const val = document.getElementById(id)?.value.trim() ?? '';
      if (!val) {
        if (id === 'exercise' && formExerciseType === 'cardio') {
          formExerciseType = 'strength';
          formCardio = { incline: '', speed: '', distance: '', time: '' };
          renderFormSection();
        } else if (id === 'add-ex' && addFormExerciseType === 'cardio') {
          addFormExerciseType = 'strength';
          addFormExercise = '';
          addFormCardio = { incline: '', speed: '', distance: '', time: '' };
          const dynEl = document.getElementById('add-form-dynamic');
          if (dynEl) dynEl.innerHTML = `<div id="add-sets-container">${renderAddSetsHtml()}</div>
            <button class="add-set-btn" onclick="addAddFormSet()">+ Add Set</button>`;
        }
      }
    }

    function comboBlur(id) {
      setTimeout(() => {
        getComboState(id).visible = false;
        const dd = document.getElementById(id + '-dd');
        if (dd) dd.style.display = 'none';
      }, 160);
    }

    function comboKeydown(e, id) {
      const s      = getComboState(id);
      const input  = document.getElementById(id);
      const query  = input?.value ?? '';
      const matches = filteredExercises(query);
      const canAdd  = query.trim() && !allExercises().some(x => x.toLowerCase() === query.trim().toLowerCase());
      const total   = matches.length + (canAdd ? 1 : 0);

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!s.visible) { comboFocus(id); return; }
        s.hl = Math.min(s.hl + 1, total - 1);
        renderComboDropdown(id);
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        s.hl = Math.max(s.hl - 1, -1);
        renderComboDropdown(id);
        return;
      }
      if (e.key === 'Escape') {
        s.visible = false;
        const dd = document.getElementById(id + '-dd');
        if (dd) dd.style.display = 'none';
        return;
      }
      if (e.key === 'Enter') {
        if (s.visible && total > 0) {
          e.preventDefault();
          if (s.hl >= 0 && s.hl < matches.length) {
            comboSelect(id, matches[s.hl]);
          } else if (s.hl === matches.length && canAdd) {
            comboAddCustom(id, query.trim());
          } else if (matches.length > 0) {
            comboSelect(id, matches[0]);
          } else if (canAdd) {
            comboAddCustom(id, query.trim());
          }
        } else {
          // Dropdown closed: advance to next field
          comboAdvance(id, e);
        }
      }
    }

    function comboAdvance(id, e) {
      if (id === 'exercise') {
        const first = document.querySelector('#sets-container .form-set-reps');
        if (first) { e.preventDefault(); first.focus(); }
      } else if (id === 'add-ex') {
        const first = document.querySelector('#add-sets-container .add-set-reps');
        if (first) { e.preventDefault(); first.focus(); }
      } else if (id.startsWith('edit-ex-')) {
        const eid = id.replace('edit-ex-', '');
        const first = document.querySelector(`#edit-sets-${eid} .edit-set-reps`);
        if (first) { e.preventDefault(); first.focus(); }
      } else if (id === 'tmpl-ex') {
        const val = document.getElementById('tmpl-ex')?.value.trim();
        if (val) {
          e.preventDefault();
          addToBuilder(val);
          document.getElementById('tmpl-ex').value = '';
        }
      }
    }

    function renderComboDropdown(id) {
      const dd = document.getElementById(id + '-dd');
      if (!dd) return;
      const s = getComboState(id);
      if (!s.visible) { dd.style.display = 'none'; return; }

      const query   = document.getElementById(id)?.value ?? '';
      const matches = filteredExercises(query);
      const canAdd  = query.trim() && !allExercises().some(x => x.toLowerCase() === query.trim().toLowerCase());

      let html = '';

      if (!query.trim()) {
        // Grouped view: custom first, then categories
        const presetSet = new Set(EXERCISE_CATEGORIES.flatMap(c => c.exercises));
        const customs   = customExercises.filter(c => !presetSet.has(c));
        if (customs.length) {
          html += `<div class="combo-group-header">Custom</div>`;
          customs.forEach(ex => {
            const i = matches.indexOf(ex);
            html += `<div class="combo-opt${s.hl === i ? ' hl' : ''}" onclick="comboSelect('${escHtml(id)}','${escHtml(ex)}')">${escHtml(ex)}</div>`;
          });
        }
        EXERCISE_CATEGORIES.forEach(cat => {
          html += `<div class="combo-group-header">${escHtml(cat.label)}</div>`;
          cat.exercises.forEach(ex => {
            const i = matches.indexOf(ex);
            html += `<div class="combo-opt${s.hl === i ? ' hl' : ''}" onclick="comboSelect('${escHtml(id)}','${escHtml(ex)}')">${escHtml(ex)}</div>`;
          });
        });
      } else {
        html = matches.map((ex, i) =>
          `<div class="combo-opt${s.hl === i ? ' hl' : ''}" onclick="comboSelect('${escHtml(id)}','${escHtml(ex)}')">${escHtml(ex)}</div>`
        ).join('');
      }

      if (canAdd) {
        const idx = matches.length;
        html += `<div class="combo-opt add-custom${s.hl === idx ? ' hl' : ''}" onclick="comboAddCustom('${escHtml(id)}','${escHtml(query.trim())}')">`
          + `＋ Save &ldquo;${escHtml(query.trim())}&rdquo; as custom</div>`;
      }

      if (!html) {
        html = `<div class="combo-opt no-match">No matches</div>`;
      }

      dd.innerHTML = html;
      dd.style.display = 'block';
    }

    function comboSelect(id, name) {
      if (id === 'tmpl-ex') {
        const input = document.getElementById(id);
        if (input) input.value = '';
        const s = getComboState(id);
        s.visible = false; s.hl = -1;
        const dd = document.getElementById(id + '-dd');
        if (dd) dd.style.display = 'none';
        addToBuilder(name);
        requestAnimationFrame(() => document.getElementById('tmpl-ex')?.focus());
        return;
      }

      const input = document.getElementById(id);
      if (input) input.value = name;
      const s = getComboState(id);
      s.visible = false;
      s.hl = -1;
      const dd = document.getElementById(id + '-dd');
      if (dd) dd.style.display = 'none';

      if (id === 'exercise') {
        const isCardio = isCardioExercise(name);
        if (isCardio !== (formExerciseType === 'cardio')) {
          formExerciseType = isCardio ? 'cardio' : 'strength';
          formCardio = { incline: '', speed: '', distance: '', time: '' };
          renderFormSection();
        }
        requestAnimationFrame(() => {
          if (isCardio) document.querySelector('#form-dynamic-section .cardio-input')?.focus();
          else          document.querySelector('#sets-container .form-set-reps')?.focus();
        });
        return;
      }

      if (id === 'add-ex') {
        const isCardio = isCardioExercise(name);
        addFormExercise = name;
        if (isCardio !== (addFormExerciseType === 'cardio')) {
          addFormExerciseType = isCardio ? 'cardio' : 'strength';
          addFormCardio = { incline: '', speed: '', distance: '', time: '' };
          addFormSets = [{ reps: '', weight: '' }];
          const dynEl = document.getElementById('add-form-dynamic');
          if (dynEl) {
            dynEl.innerHTML = isCardio
              ? cardioFormHtml(name, addFormCardio, 'addFormCardio')
              : `<div id="add-sets-container">${renderAddSetsHtml()}</div>
                 <button class="add-set-btn" onclick="addAddFormSet()">+ Add Set</button>`;
          }
        }
        requestAnimationFrame(() => {
          if (isCardio) document.querySelector('#add-form-dynamic .cardio-input')?.focus();
          else          document.querySelector('#add-sets-container .add-set-reps')?.focus();
        });
        return;
      }

      // edit-ex-* : auto-advance to first reps field (type stays fixed per entry)
      requestAnimationFrame(() => {
        if (id.startsWith('edit-ex-')) {
          const eid = id.replace('edit-ex-', '');
          document.querySelector(`#edit-sets-${eid} .edit-set-reps`)?.focus();
        }
      });
    }

    function comboAddCustom(id, name) {
      const trimmed = name.trim();
      if (!trimmed) return;
      if (!customExercises.includes(trimmed)) {
        customExercises.push(trimmed);
        customExercises.sort();
        localStorage.setItem(CUSTOM_KEY, JSON.stringify(customExercises));
      }
      comboSelect(id, trimmed);
    }

    // ── Validation ────────────────────────────────────────────────────────────

    function parseSets(setsState, repsSelector) {
      const valid = [];
      for (let i = 0; i < setsState.length; i++) {
        const reps = parseInt(setsState[i].reps);
        const w    = parseFloat(setsState[i].weight);
        if (!reps || reps < 1) {
          const el = document.querySelectorAll(repsSelector)[i];
          if (el) {
            el.style.borderColor = 'var(--danger)';
            el.focus();
            setTimeout(() => { if (el) el.style.borderColor = ''; }, 1000);
          }
          return null;
        }
        valid.push({ reps, weight: inputToKg(isNaN(w) ? null : w) });
      }
      return valid.length ? valid : null;
    }

    function shakeEl(el) {
      if (!el) return;
      el.style.borderColor = 'var(--danger)';
      el.focus();
      setTimeout(() => el.style.borderColor = '', 1000);
    }

    // ── Entry logging ─────────────────────────────────────────────────────────

    function addEntry() {
      const exercise = document.getElementById('exercise').value.trim();
      if (!exercise) return shakeEl(document.getElementById('exercise'));

      const shouldBeCardio = isCardioExercise(exercise);
      if (shouldBeCardio !== (formExerciseType === 'cardio')) {
        formExerciseType = shouldBeCardio ? 'cardio' : 'strength';
        formCardio = { incline: '', speed: '', distance: '', time: '' };
        renderFormSection();
        return;
      }

      const ts = logDate
        ? (() => { const d = new Date(logDate); d.setHours(12,0,0,0); return d.getTime(); })()
        : Date.now();

      const entries = load();

      if (formExerciseType === 'cardio') {
        const cardio = parseCardioFields(formCardio, exercise);
        if (!cardio) return;
        entries.push({ id: Date.now(), exercise, cardio, ts });
        entries.sort((a, b) => b.ts - a.ts);
        save(entries);
        document.getElementById('exercise').value = '';
        formExerciseType = 'strength';
        formCardio = { incline: '', speed: '', distance: '', time: '' };
        renderFormSection();
      } else {
        const sets = parseSets(formSets, '#sets-container .form-set-reps');
        if (!sets) return;
        const flagged = flagPRs(sets, exercise, entries.filter(e => e.ts < ts));
        entries.push({ id: Date.now(), exercise, sets: flagged, ts });
        entries.sort((a, b) => b.ts - a.ts);
        save(entries);
        document.getElementById('exercise').value = '';
        formSets = [{ reps: '', weight: '' }];
        renderFormSection();
      }

      advanceSession();
      if (!activeSession) document.getElementById('exercise').focus();
      render();
      updateStats();
    }

    // ── Delete ────────────────────────────────────────────────────────────────

    function deleteEntry(id) {
      if (editingId === id) editingId = null;
      save(load().filter(e => e.id !== id));
      render();
      updateStats();
    }

    // ── Edit ──────────────────────────────────────────────────────────────────

    function startEdit(id) {
      const entry = load().find(e => e.id === id);
      if (!entry) return;
      if (entry.cardio) {
        const c = entry.cardio;
        editFormCardio = {
          time:     c.time     ?? '',
          distance: c.distance != null ? kmToInput(c.distance) : '',
          speed:    c.speed    != null ? kmToInput(c.speed)    : '',
          incline:  c.incline  ?? '',
        };
      } else {
        const norm = normalizeEntry(entry);
        editFormSets = norm.sets.map(s => ({ reps: s.reps ?? '', weight: kgToInput(s.weight) }));
      }
      editingId    = id;
      addingToDate = null;
      render();
      requestAnimationFrame(() => document.getElementById(`edit-ex-${id}`)?.focus());
    }

    function cancelEdit() { editingId = null; render(); }

    function saveEdit(id) {
      const exercise = document.getElementById(`edit-ex-${id}`)?.value.trim();
      if (!exercise) return shakeEl(document.getElementById(`edit-ex-${id}`));

      const entries = load();
      const idx = entries.findIndex(e => e.id === id);
      if (idx === -1) return;

      const original = entries[idx];
      if (original.cardio) {
        const cardio = parseCardioFields(editFormCardio, exercise);
        if (!cardio) return;
        entries[idx] = { id: original.id, exercise, cardio, ts: original.ts };
      } else {
        const sets = parseSets(editFormSets, `#edit-sets-${id} .edit-set-reps`);
        if (!sets) return;
        entries[idx] = { id: original.id, exercise, sets, ts: original.ts };
      }

      save(entries);
      editingId = null;
      render();
      updateStats();
    }
