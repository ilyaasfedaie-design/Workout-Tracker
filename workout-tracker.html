    function saveNewEntry(dateStr) {
      const exercise = document.getElementById('add-ex')?.value.trim();
      if (!exercise) return shakeEl(document.getElementById('add-ex'));

      const shouldBeCardio = isCardioExercise(exercise);
      if (shouldBeCardio !== (addFormExerciseType === 'cardio')) {
        addFormExerciseType = shouldBeCardio ? 'cardio' : 'strength';
        addFormCardio = { incline: '', speed: '', distance: '', time: '' };
        const dynEl = document.getElementById('add-form-dynamic');
        if (dynEl) dynEl.innerHTML = shouldBeCardio
          ? cardioFormHtml(exercise, addFormCardio, 'addFormCardio')
          : `<div id="add-sets-container">${renderAddSetsHtml()}</div>
             <button class="add-set-btn" onclick="addAddFormSet()">+ Add Set</button>`;
        return;
      }

      const d = new Date(dateStr); d.setHours(12, 0, 0, 0);
      const entries = load();

      if (addFormExerciseType === 'cardio') {
        const cardio = parseCardioFields(addFormCardio, exercise);
        if (!cardio) return;
        entries.push({ id: Date.now(), exercise, cardio, ts: d.getTime() });
      } else {
        const sets = parseSets(addFormSets, '#add-sets-container .add-set-reps');
        if (!sets) return;
        const flagged = flagPRs(sets, exercise, entries.filter(e => e.ts < d.getTime()));
        entries.push({ id: Date.now(), exercise, sets: flagged, ts: d.getTime() });
      }

      entries.sort((a, b) => b.ts - a.ts);
      save(entries);

      addingToDate        = null;
      addFormExerciseType = 'strength';
      addFormExercise     = '';
      render();
      updateStats();
    }

    // ── View ──────────────────────────────────────────────────────────────────

    function setView(v) {
      currentView  = v;
      editingId    = null;
      addingToDate = null;
      document.getElementById('btn-list').classList.toggle('active', v === 'list');
      document.getElementById('btn-date').classList.toggle('active', v === 'date');
      document.getElementById('btn-progress').classList.toggle('active', v === 'progress');
      document.getElementById('btn-prs').classList.toggle('active', v === 'prs');
      render();
    }

    function toggleDate(dateStr) {
      if (openDates.has(dateStr)) {
        openDates.delete(dateStr);
        editingId = null;
        if (addingToDate === dateStr) addingToDate = null;
      } else {
        openDates.add(dateStr);
      }
      render();
    }

    // ── Calendar ──────────────────────────────────────────────────────────────

    function calMonthFor(ctx) {
      if (ctx === 'log') return logCalMonth;
      if (ctx === 'bw')  return bwCalMonth;
      return browseCalMonth;
    }

    function toggleCal(ctx) {
      if (calendarOpen === ctx) {
        calendarOpen = '';
      } else {
        calendarOpen = ctx;
        if (ctx === 'log')      { logCalMonth = new Date(logDate || new Date()); logCalMonth.setDate(1); }
        else if (ctx === 'bw') { bwCalMonth  = new Date(bwLogDate || new Date()); bwCalMonth.setDate(1); }
        else                   { browseCalMonth = new Date(); browseCalMonth.setDate(1); }
      }
      document.getElementById('browse-cal-btn')?.classList.toggle('active',   calendarOpen === 'browse');
      document.getElementById('log-date-btn')?.classList.toggle('cal-open',   calendarOpen === 'log');
      document.getElementById('bw-date-btn')?.classList.toggle('cal-open',    calendarOpen === 'bw');
      renderCalWidget('log');
      renderCalWidget('browse');
      renderCalWidget('bw');
    }

    function calPrev(ctx) { calMonthFor(ctx).setMonth(calMonthFor(ctx).getMonth() - 1); renderCalWidget(ctx); }
    function calNext(ctx) { calMonthFor(ctx).setMonth(calMonthFor(ctx).getMonth() + 1); renderCalWidget(ctx); }

    function selectCalDay(ymd, ctx) {
      const [y, m, d] = ymd.split('-').map(Number);
      const sel = new Date(y, m - 1, d); sel.setHours(0, 0, 0, 0);

      if (ctx === 'bw') {
        const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
        if (sel > todayStart) return;
        bwLogDate = sel.getTime() === todayStart.getTime() ? null : sel;
        calendarOpen = '';
        document.getElementById('bw-date-btn')?.classList.remove('cal-open');
        renderCalWidget('bw');
        updateBWDateBtn();
        return;
      }

      if (ctx === 'log') {
        const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
        if (sel > todayStart) return;
        logDate = sel.getTime() === todayStart.getTime() ? null : sel;
        calendarOpen = '';
        document.getElementById('log-date-btn').classList.remove('cal-open');
        renderCalWidget('log');
        updateLogDateBtn();
      } else {
        const dateStr = sel.toDateString();
        calendarOpen  = '';
        document.getElementById('browse-cal-btn').classList.remove('active');
        renderCalWidget('browse');
        currentView = 'date';
        document.getElementById('btn-list').classList.remove('active');
        document.getElementById('btn-date').classList.add('active');
        document.getElementById('btn-progress').classList.remove('active');
        document.getElementById('btn-prs').classList.remove('active');
        openDates.add(dateStr);
        editingId = null; addingToDate = null;
        render();
        requestAnimationFrame(() => {
          for (const g of document.querySelectorAll('.date-group')) {
            if (g.querySelector('.date-label')?.textContent === formatDateHeader(dateStr)) {
              g.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
            }
          }
        });
      }
    }

    function renderCalWidget(ctx) {
      const el = document.getElementById(ctx + '-cal');
      if (!el) return;
      el.innerHTML = calendarOpen === ctx ? buildCalHtml(ctx) : '';
    }

    function buildCalHtml(ctx) {
      const vm    = calMonthFor(ctx);
      const year  = vm.getFullYear();
      const month = vm.getMonth();

      const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
      const todayTs    = todayStart.getTime();

      const entryDates = new Set(load().map(e => {
        const d = new Date(e.ts);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }));

      let selTs = null;
      if (ctx === 'log') {
        const s = logDate ? new Date(logDate) : new Date(); s.setHours(0,0,0,0);
        selTs = s.getTime();
      } else if (ctx === 'bw') {
        const s = bwLogDate ? new Date(bwLogDate) : new Date(); s.setHours(0,0,0,0);
        selTs = s.getTime();
      }

      const firstDow    = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthLabel  = new Date(year, month, 1).toLocaleDateString([], { month: 'long', year: 'numeric' });
      const canNext     = ctx === 'browse' || new Date(year, month + 1, 1) <= todayStart;

      const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
      let cells = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
      for (let i = 0; i < firstDow; i++) cells += `<div class="cal-day empty"></div>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const ts     = new Date(year, month, day).getTime();
        const ymd    = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const future = ctx !== 'browse' && ts > todayTs;
        const cls = ['cal-day',
          ts === todayTs              ? 'today'                          : '',
          (ctx === 'log' || ctx === 'bw') && ts === selTs ? 'selected'  : '',
          entryDates.has(ymd)         ? 'has-entries' : '',
          future                      ? 'future'      : '',
        ].filter(Boolean).join(' ');
        cells += `<div class="${cls}" ${future ? '' : `onclick="selectCalDay('${ymd}','${ctx}')"`}>${day}</div>`;
      }

      return `<div class="calendar">
        <div class="cal-header">
          <button class="cal-nav" onclick="calPrev('${ctx}')">&#8249;</button>
          <span class="cal-title">${monthLabel}</span>
          <button class="cal-nav" onclick="calNext('${ctx}')" ${canNext ? '' : 'disabled'}>&#8250;</button>
        </div>
        <div class="cal-grid">${cells}</div>
      </div>`;
    }

    function updateLogDateBtn() {
      const btn = document.getElementById('log-date-btn');
      if (!btn) return;
      if (!logDate) { btn.textContent = 'Today ▾'; return; }
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const ldStart    = new Date(logDate); ldStart.setHours(0,0,0,0);
      const yest       = new Date(todayStart); yest.setDate(todayStart.getDate()-1);
      btn.textContent = ldStart.getTime() === yest.getTime()
        ? 'Yesterday ▾'
        : logDate.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ▾';
    }

    // ── Progress chart ────────────────────────────────────────────────────────

    function setProgressExercise(name) {
      selectedProgressExercise = name;
      const canvas = document.getElementById('progress-chart');
      const statsRow = document.getElementById('progress-stats-row');
      const empty  = document.getElementById('progress-empty');
      if (!name) {
        if (statsRow) statsRow.style.display = 'none';
        if (canvas) canvas.style.display = 'none';
        if (empty) { empty.textContent = 'Select an exercise to see its progress.'; empty.style.display = ''; }
        return;
      }
      if (empty) empty.style.display = 'none';
      if (canvas) canvas.style.display = 'block';
      requestAnimationFrame(() => drawProgressChart(name));
    }

    function renderProgress() {
      const all       = load();
      const exercises = [...new Set(all.filter(e => !e.cardio).map(e => e.exercise))].sort();
      const select    = document.getElementById('progress-exercise');

      if (select) {
        select.innerHTML = '<option value="">— Select an exercise —</option>' +
          exercises.map(ex => `<option value="${escHtml(ex)}"${ex === selectedProgressExercise ? ' selected' : ''}>${escHtml(ex)}</option>`).join('');
      }

      const canvas   = document.getElementById('progress-chart');
      const statsRow = document.getElementById('progress-stats-row');
      const empty    = document.getElementById('progress-empty');

      if (!exercises.length) {
        if (statsRow) statsRow.style.display = 'none';
        if (canvas) canvas.style.display = 'none';
        if (empty) { empty.textContent = 'No exercises logged yet.'; empty.style.display = ''; }
        return;
      }

      if (!selectedProgressExercise || !exercises.includes(selectedProgressExercise)) {
        if (statsRow) statsRow.style.display = 'none';
        if (canvas) canvas.style.display = 'none';
        if (empty) { empty.textContent = 'Select an exercise to see its progress.'; empty.style.display = ''; }
        return;
      }

      if (empty) empty.style.display = 'none';
      if (canvas) canvas.style.display = 'block';
      requestAnimationFrame(() => drawProgressChart(selectedProgressExercise));
    }

    function drawProgressChart(exercise) {
      const canvas = document.getElementById('progress-chart');
      if (!canvas) return;

      const W = canvas.parentElement?.clientWidth || 360;
      const H = 200;
      canvas.width  = W;
      canvas.height = H;

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      // Gather: max weight per calendar day for this exercise
      const entries = load()
        .filter(e => !e.cardio)
        .map(normalizeEntry)
        .filter(e => e.exercise === exercise);

      const byDate = new Map();
      entries.forEach(e => {
        const dk = new Date(e.ts).toDateString();
        if (!byDate.has(dk)) byDate.set(dk, { ts: e.ts, maxKg: null });
        const rec = byDate.get(dk);
        e.sets.forEach(s => {
          if (s.weight != null && (rec.maxKg === null || s.weight > rec.maxKg)) rec.maxKg = s.weight;
        });
      });

      const points = [...byDate.values()].filter(p => p.maxKg !== null).sort((a, b) => a.ts - b.ts);

      const statsRow = document.getElementById('progress-stats-row');

      if (!points.length) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
        ctx.font = '13px -apple-system,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('No weight data logged for this exercise.', W / 2, H / 2);
        if (statsRow) statsRow.style.display = 'none';
        return;
      }

      // Summary stats
      const allKg  = points.map(p => p.maxKg);
      const bestKg = Math.max(...allKg);
      const lastKg = allKg[allKg.length - 1];
      if (statsRow) {
        statsRow.style.display = 'grid';
        statsRow.innerHTML = `
          <div class="progress-stat"><div class="progress-stat-value">${displayWeight(bestKg)}</div><div class="progress-stat-label">Best</div></div>
          <div class="progress-stat"><div class="progress-stat-value">${displayWeight(lastKg)}</div><div class="progress-stat-label">Last Session</div></div>
          <div class="progress-stat"><div class="progress-stat-value">${points.length}</div><div class="progress-stat-label">Sessions</div></div>`;
      }

      // Layout
      const PAD = { top: 14, right: 14, bottom: 36, left: 48 };
      const cW = W - PAD.left - PAD.right;
      const cH = H - PAD.top - PAD.bottom;

      const minKg   = Math.min(...allKg);
      const maxKg2  = Math.max(...allKg);
      const spread  = maxKg2 - minKg || maxKg2 * 0.1 || 10;
      const yMin    = Math.max(0, minKg - spread * 0.25);
      const yMax    = maxKg2 + spread * 0.25;

      const xOf = i => PAD.left + (points.length === 1 ? cW / 2 : (i / (points.length - 1)) * cW);
      const yOf = v  => PAD.top  + cH * (1 - (v - yMin) / (yMax - yMin));

      const _cs = getComputedStyle(document.documentElement);
      const C = { border: _cs.getPropertyValue('--border').trim(), accent: _cs.getPropertyValue('--accent').trim(), muted: _cs.getPropertyValue('--muted').trim(), bg: _cs.getPropertyValue('--bg').trim() };

      // Grid lines + y labels
      const TICKS = 4;
      ctx.setLineDash([3, 4]);
      ctx.strokeStyle = C.border;
      ctx.lineWidth   = 1;
      for (let t = 0; t <= TICKS; t++) {
        const y   = PAD.top + (t / TICKS) * cH;
        const val = yMax - (t / TICKS) * (yMax - yMin);
        ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(W - PAD.right, y); ctx.stroke();
        ctx.fillStyle = C.muted;
        ctx.font = '10px -apple-system,sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(displayWeightShort(val), PAD.left - 5, y);
      }
      ctx.setLineDash([]);

      // Y-axis unit label
      ctx.save();
      ctx.translate(9, PAD.top + cH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = C.muted;
      ctx.font = '10px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(unit, 0, 0);
      ctx.restore();

      // Area fill
      const grad = ctx.createLinearGradient(0, PAD.top, 0, PAD.top + cH);
      grad.addColorStop(0, accentAlpha(0.22));
      grad.addColorStop(1, accentAlpha(0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      points.forEach((p, i) => { i === 0 ? ctx.moveTo(xOf(i), yOf(p.maxKg)) : ctx.lineTo(xOf(i), yOf(p.maxKg)); });
      ctx.lineTo(xOf(points.length - 1), PAD.top + cH);
      ctx.lineTo(xOf(0), PAD.top + cH);
      ctx.closePath();
      ctx.fill();

      // Line
      ctx.strokeStyle = C.accent;
      ctx.lineWidth   = 2;
      ctx.lineJoin    = 'round';
      ctx.lineCap     = 'round';
      ctx.beginPath();
      points.forEach((p, i) => { i === 0 ? ctx.moveTo(xOf(i), yOf(p.maxKg)) : ctx.lineTo(xOf(i), yOf(p.maxKg)); });
      ctx.stroke();

      // Dots
      points.forEach((p, i) => {
        ctx.beginPath(); ctx.arc(xOf(i), yOf(p.maxKg), 4, 0, Math.PI * 2);
        ctx.fillStyle = C.accent; ctx.fill();
        ctx.beginPath(); ctx.arc(xOf(i), yOf(p.maxKg), 2, 0, Math.PI * 2);
        ctx.fillStyle = C.bg; ctx.fill();
      });

      // X labels (≤ 6 evenly spaced, always including last)
      const shown   = new Set();
      const xStep   = Math.max(1, Math.floor(points.length / 6));
      for (let i = 0; i < points.length; i += xStep) shown.add(i);
      shown.add(points.length - 1);
      ctx.fillStyle = C.muted;
      ctx.font = '10px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      shown.forEach(i => {
        ctx.fillText(
          new Date(points[i].ts).toLocaleDateString([], { month: 'short', day: 'numeric' }),
          xOf(i), H - PAD.bottom + 6
        );
      });
    }

    // ── Formatting ────────────────────────────────────────────────────────────

    function dateKey(ts) { return new Date(ts).toDateString(); }

    function formatDateHeader(dateStr) {
      const d = new Date(dateStr), now = new Date();
      if (d.toDateString() === now.toDateString()) return 'Today';
      const yest = new Date(now); yest.setDate(now.getDate()-1);
      if (d.toDateString() === yest.toDateString()) return 'Yesterday';
      return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDateFull(ts) {
      const d = new Date(ts), now = new Date(), t = formatTime(ts);
      if (d.toDateString() === now.toDateString()) return 'Today ' + t;
      const yest = new Date(now); yest.setDate(now.getDate()-1);
      if (d.toDateString() === yest.toDateString()) return 'Yesterday ' + t;
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + t;
    }

    // ── Entry HTML ────────────────────────────────────────────────────────────

    function entryHtml(e, timeLabel) {
      const isCardio = !!e.cardio;

      if (editingId === e.id) {
        const editFields = isCardio
          ? cardioFormHtml(e.exercise, editFormCardio, 'editFormCardio')
          : `<div id="edit-sets-${e.id}">${renderEditSetsHtml(e.id)}</div>
             <button class="add-set-btn" onclick="addEditSet(${e.id})">+ Add Set</button>`;
        return `<div class="entry editing">
          <div class="combo-wrap">
            <input id="edit-ex-${e.id}" class="edit-ex-input" type="text"
                   value="${escHtml(e.exercise)}" placeholder="Exercise"
                   onfocus="comboFocus('edit-ex-${e.id}')"
                   oninput="comboInput('edit-ex-${e.id}')"
                   onblur="comboBlur('edit-ex-${e.id}')"
                   onkeydown="comboKeydown(event,'edit-ex-${e.id}')" />
            <div id="edit-ex-${e.id}-dd" class="combo-dropdown"></div>
          </div>
          ${editFields}
          <div class="edit-actions">
            <button class="btn-save" onclick="saveEdit(${e.id})">Save</button>
            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
          </div>
        </div>`;
      }

      let detailHtml;
      if (isCardio) {
        const c = e.cardio;
        const fields = CARDIO_FIELDS[e.exercise] || [];
        const parts = [];
        if (fields.includes('time')     && c.time     != null) parts.push(`${c.time} min`);
        if (fields.includes('distance') && c.distance != null) parts.push(displayDistance(c.distance));
        if (fields.includes('speed')    && c.speed    != null) parts.push(displaySpeed(c.speed));
        if (fields.includes('incline')  && c.incline  != null) parts.push(`${c.incline}% incline`);
        detailHtml = `<div class="sets-display"><div class="set-line">${parts.join(' · ') || '—'}</div></div>`;
      } else {
        const norm = normalizeEntry(e);
        detailHtml = `<div class="sets-display">${norm.sets.map((s, i) => {
          const w = s.weight != null ? ' · ' + displayWeight(s.weight) : '';
          const pr = s.pr ? ' <span class="pr-badge">PR</span>' : '';
          return `<div class="set-line">Set ${i+1}: ${s.reps} reps${w}${pr}</div>`;
        }).join('')}</div>`;
      }

      return `<div class="entry">
        <div class="entry-info">
          <div class="entry-name">${escHtml(e.exercise)}${isCardio ? '<span class="cardio-tag">Cardio</span>' : ''}</div>
          ${detailHtml}
        </div>
        <div class="entry-time">${timeLabel}</div>
        <button class="edit-btn" onclick="startEdit(${e.id})" title="Edit">✎</button>
        <button class="delete-btn" onclick="deleteEntry(${e.id})" title="Delete">✕</button>
      </div>`;
    }

    // ── Render ────────────────────────────────────────────────────────────────

    function render() {
      const filterRow    = document.getElementById('filter-row');
      const entryList    = document.getElementById('entry-list');
      const progressView = document.getElementById('progress-view');
      const prView       = document.getElementById('pr-view');

      document.getElementById('count-badge').textContent = load().length;

      if (currentView === 'progress') {
        if (filterRow)    filterRow.style.display    = 'none';
        if (entryList)    entryList.style.display    = 'none';
        if (progressView) progressView.style.display = '';
        if (prView)       prView.style.display       = 'none';
        renderProgress();
        return;
      }

      if (currentView === 'prs') {
        if (filterRow)    filterRow.style.display    = 'none';
        if (entryList)    entryList.style.display    = 'none';
        if (progressView) progressView.style.display = 'none';
        if (prView)       prView.style.display       = '';
        renderPRView();
        return;
      }

      if (filterRow)    filterRow.style.display    = '';
      if (entryList)    entryList.style.display    = '';
      if (progressView) progressView.style.display = 'none';
      if (prView)       prView.style.display       = 'none';

      const query    = document.getElementById('search').value.trim().toLowerCase();
      const all      = load();
      const filtered = all.filter(e => !query || e.exercise.toLowerCase().includes(query));

      if (!filtered.length) {
        entryList.innerHTML = `<div class="empty">${query ? 'No matches found.' : 'No entries yet. Log your first exercise!'}</div>`;
        return;
      }

      if (currentView === 'list') {
        entryList.innerHTML = filtered.map(e => entryHtml(e, formatDateFull(e.ts))).join('');
        return;
      }

      // By Date view
      const groups = new Map();
      filtered.forEach(e => {
        const k = dateKey(e.ts);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(e);
      });

      entryList.innerHTML = [...groups.entries()].map(([dateStr, entries]) => {
        const isOpen = openDates.has(dateStr);
        let inner = '';
        if (isOpen) {
          const addArea = addingToDate === dateStr
            ? `<div class="entry editing">
                <div class="combo-wrap">
                  <input id="add-ex" class="edit-ex-input" type="text"
                         value="${escHtml(addFormExercise)}"
                         placeholder="Exercise" autocomplete="off"
                         onfocus="comboFocus('add-ex')"
                         oninput="comboInput('add-ex')"
                         onblur="comboBlur('add-ex')"
                         onkeydown="comboKeydown(event,'add-ex')" />
                  <div id="add-ex-dd" class="combo-dropdown"></div>
                </div>
                <div id="add-form-dynamic">
                  ${addFormExerciseType === 'cardio'
                    ? cardioFormHtml(addFormExercise, addFormCardio, 'addFormCardio')
                    : `<div id="add-sets-container">${renderAddSetsHtml()}</div>
                       <button class="add-set-btn" onclick="addAddFormSet()">+ Add Set</button>`}
                </div>
                <div class="edit-actions">
                  <button class="btn-save" onclick="saveNewEntry('${dateStr}')">Add</button>
                  <button class="btn-cancel" onclick="cancelAdd()">Cancel</button>
                </div>
              </div>`
            : `<button class="date-add-btn" onclick="showAddForm('${dateStr}')">+ Add exercise</button>`;
          inner = `<div class="date-entries">
            ${entries.map(e => entryHtml(e, formatTime(e.ts))).join('')}
            ${addArea}
            <div class="day-notes">
              <textarea class="day-notes-textarea"
                        placeholder="Notes for this day…"
                        oninput="saveNote('${dateStr}', this.value)"
              >${escHtml(dayNotes[dateStr] || '')}</textarea>
            </div>
          </div>`;
        }
        return `<div class="date-group">
          <div class="date-header" onclick="toggleDate('${dateStr}')">
            <span class="date-chevron ${isOpen ? 'open' : ''}">▶</span>
            <span class="date-label">${formatDateHeader(dateStr)}</span>
            <span class="date-count">${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}</span>
          </div>
          ${inner}
        </div>`;
      }).join('');
    }

    // ── Stats ─────────────────────────────────────────────────────────────────

    function updateStats() {
      const entries    = load();
      const todayStr   = new Date().toDateString();
      const todayCount = entries.filter(e => new Date(e.ts).toDateString() === todayStr).length;
      const unique     = new Set(entries.map(e => e.exercise.toLowerCase())).size;
      document.getElementById('stat-total').textContent     = entries.length;
      document.getElementById('stat-today').textContent     = todayCount;
      document.getElementById('stat-exercises').textContent = unique;
      renderStatsCard();
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Theme ─────────────────────────────────────────────────────────────────

    function themeVarsFor(theme) {
      if (theme.id === 'custom') {
        const bg = theme.bg || '#0f0f0f', text = theme.text || '#f0f0f0', accent = theme.accent || '#6c63ff';
        return { bg, text, accent, accentDim: darkenHex(accent, 0.2),
                 surface: blendHex(bg, text, 0.09), border: blendHex(bg, text, 0.17), muted: blendHex(bg, text, 0.55) };
      }
      const p = PRESETS.find(x => x.id === theme.id) || PRESETS[0];
      return { bg: p.bg, surface: p.surface, border: p.border, text: p.text, muted: p.muted, accent: p.accent, accentDim: p.accentDim };
    }

    function applyTheme(vars) {
      const r = document.documentElement;
      r.style.setProperty('--bg',         vars.bg);
      r.style.setProperty('--surface',    vars.surface);
      r.style.setProperty('--border',     vars.border);
      r.style.setProperty('--text',       vars.text);
      r.style.setProperty('--muted',      vars.muted);
      r.style.setProperty('--accent',     vars.accent);
      r.style.setProperty('--accent-dim', vars.accentDim);
    }

    function saveThemeToStorage() {
      localStorage.setItem(THEME_KEY, JSON.stringify(currentTheme));
    }

    function selectPreset(id) {
      if (id === 'custom') {
        currentTheme = { id: 'custom',
          bg:     currentTheme.bg     || '#0f0f0f',
          text:   currentTheme.text   || '#f0f0f0',
          accent: currentTheme.accent || '#6c63ff' };
      } else {
        currentTheme = { id };
      }
      applyTheme(themeVarsFor(currentTheme));
      saveThemeToStorage();
      renderThemeCard();
    }

    function setCustomColor(key, value) {
      currentTheme[key] = value;
      saveThemeToStorage();
      applyTheme(themeVarsFor(currentTheme));
    }

    function renderThemeCard() {
      const el = document.getElementById('theme-content');
      if (!el) return;

      const customPreview = currentTheme.id === 'custom'
        ? { bg: currentTheme.bg || '#0f0f0f', surface: blendHex(currentTheme.bg||'#0f0f0f', currentTheme.text||'#f0f0f0', 0.09), accent: currentTheme.accent || '#6c63ff' }
        : { bg: '#1a1a1a', surface: '#2a2a2a', accent: '#6c63ff' };

      const swatchHtml = [...PRESETS, { id: 'custom', name: 'Custom', ...customPreview }].map(p => {
        const isActive = currentTheme.id === p.id;
        const surf = p.surface || blendHex(p.bg, p.text || '#f0f0f0', 0.09);
        return `<div class="theme-swatch${isActive ? ' active' : ''}" onclick="selectPreset('${p.id}')">
          <div class="swatch-preview" style="background:${escHtml(p.bg)}">
            <div class="swatch-surface" style="background:${escHtml(surf)}"></div>
            <div class="swatch-accent" style="background:${escHtml(p.accent)}"></div>
          </div>
          <div class="swatch-name">${escHtml(p.name)}</div>
        </div>`;
      }).join('');

      const pickersHtml = currentTheme.id === 'custom' ? `
        <div class="theme-custom-pickers">
          <div class="color-pick-row">
            <label>Background</label>
            <input type="color" value="${escHtml(currentTheme.bg || '#0f0f0f')}" oninput="setCustomColor('bg',this.value)">
          </div>
          <div class="color-pick-row">
            <label>Text</label>
            <input type="color" value="${escHtml(currentTheme.text || '#f0f0f0')}" oninput="setCustomColor('text',this.value)">
          </div>
          <div class="color-pick-row">
            <label>Accent</label>
            <input type="color" value="${escHtml(currentTheme.accent || '#6c63ff')}" oninput="setCustomColor('accent',this.value)">
          </div>
        </div>` : '';

      el.innerHTML = `<div class="theme-presets">${swatchHtml}</div>${pickersHtml}`;
    }

    // ── Templates ─────────────────────────────────────────────────────────────

    function saveTemplates() {
      localStorage.setItem(TEMPLATES_KEY, JSON.stringify(templates));
    }

    function toggleTemplateBuilder() {
      builderOpen = !builderOpen;
      if (builderOpen) builderExercises = [];
      renderTemplatesCard();
      if (builderOpen) {
        requestAnimationFrame(() => document.getElementById('tmpl-name')?.focus());
      }
    }

    function addToBuilder(name) {
      if (!name.trim()) return;
      builderExercises.push(name.trim());
      renderBuilderList();
    }

    function removeFromBuilder(i) {
      builderExercises.splice(i, 1);
      renderBuilderList();
    }

    function renderBuilderList() {
      const el = document.getElementById('builder-ex-list');
      if (!el) return;
      if (!builderExercises.length) {
        el.innerHTML = '<div class="builder-empty">No exercises added yet</div>';
        return;
      }
      el.innerHTML = builderExercises.map((ex, i) =>
        `<div class="exercise-pill">${escHtml(ex)}<button class="pill-remove" onclick="removeFromBuilder(${i})">×</button></div>`
      ).join('');
    }

    function saveTemplate() {
      const nameEl = document.getElementById('tmpl-name');
      const name   = nameEl ? nameEl.value.trim() : '';
      if (!name) return shakeEl(nameEl);
      if (!builderExercises.length) {
        shakeEl(document.getElementById('builder-ex-list'));
        return;
      }
      templates.push({ id: Date.now(), name, exercises: [...builderExercises] });
      saveTemplates();
      builderOpen     = false;
      builderExercises = [];
      renderTemplatesCard();
    }

    function deleteTemplate(id) {
      templates = templates.filter(t => t.id !== id);
      saveTemplates();
      renderTemplatesCard();
    }

    function startSession(id) {
      const tmpl = templates.find(t => t.id === id);
      if (!tmpl || !tmpl.exercises.length) return;
      activeSession = { name: tmpl.name, exercises: tmpl.exercises, index: 0 };
      prefillSessionExercise();
      updateSessionBar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function stopSession() {
      activeSession = null;
      document.getElementById('exercise').value = '';
      formExerciseType = 'strength';
      formCardio = { incline: '', speed: '', distance: '', time: '' };
      formSets = [{ reps: '', weight: '' }];
      renderFormSection();
      updateSessionBar();
    }

    function advanceSession() {
      if (!activeSession) return;
      activeSession.index++;
      if (activeSession.index >= activeSession.exercises.length) {
        activeSession = null;
        updateSessionBar();
        return;
      }
      prefillSessionExercise();
      updateSessionBar();
    }

    function prefillSessionExercise() {
      if (!activeSession) return;
      const ex = activeSession.exercises[activeSession.index];
      const input = document.getElementById('exercise');
      if (input) input.value = ex;
      const isCardio = isCardioExercise(ex);
      formExerciseType = isCardio ? 'cardio' : 'strength';
      formCardio = { incline: '', speed: '', distance: '', time: '' };
      formSets   = [{ reps: '', weight: '' }];
      renderFormSection();
    }

    function updateSessionBar() {
      const bar = document.getElementById('session-bar');
      if (!bar) return;
      if (!activeSession) {
        bar.style.display = 'none';
        return;
      }
      const { name, exercises, index } = activeSession;
      const ex = exercises[index];
      const pct = Math.round((index / exercises.length) * 100);
      bar.style.display = '';
      bar.innerHTML = `
        <div class="session-info">
          <span class="session-name">${escHtml(name)}</span>
          <span class="session-exercise">${escHtml(ex)}</span>
          <div class="session-progress">
            <div class="session-progress-track">
              <div class="session-progress-fill" style="width:${pct}%"></div>
            </div>
            <span class="session-progress-label">${index + 1} / ${exercises.length}</span>
          </div>
        </div>
        <div class="session-btns">
          <button class="session-skip" onclick="advanceSession()">Skip ›</button>
          <button class="session-stop" onclick="stopSession()">✕</button>
        </div>`;
    }

    function renderTemplatesCard() {
      const el = document.getElementById('templates-content');
      if (!el) return;

      const builderHtml = builderOpen ? `
        <div class="tmpl-builder">
          <input id="tmpl-name" class="tmpl-name-input" type="text" placeholder="Template name…" autocomplete="off" />
          <div class="tmpl-ex-row">
            <div class="combo-wrap" style="flex:1">
              <input id="tmpl-ex" type="text" placeholder="Add exercise…" autocomplete="off"
                     onfocus="comboFocus('tmpl-ex')"
                     oninput="comboInput('tmpl-ex')"
                     onblur="comboBlur('tmpl-ex')"
                     onkeydown="comboKeydown(event,'tmpl-ex')" />
              <div id="tmpl-ex-dd" class="combo-dropdown"></div>
            </div>
          </div>
          <div id="builder-ex-list" class="builder-ex-list">
            <div class="builder-empty">No exercises added yet</div>
          </div>
          <div class="tmpl-builder-actions">
            <button class="btn-save" onclick="saveTemplate()">Save Template</button>
            <button class="btn-cancel" onclick="toggleTemplateBuilder()">Cancel</button>
          </div>
        </div>` : '';

      const listHtml = templates.length ? templates.map(t => `
        <div class="template-card">
          <div class="template-card-top">
            <span class="template-name">${escHtml(t.name)}</span>
            <div class="template-actions">
              <button class="btn-start" onclick="startSession(${t.id})">▶ Start</button>
              <button class="btn-cancel" onclick="deleteTemplate(${t.id})">Delete</button>
            </div>
          </div>
          <div class="template-exercises">
            ${t.exercises.map(ex => `<span class="exercise-pill">${escHtml(ex)}</span>`).join('')}
          </div>
        </div>`).join('')
        : (!builderOpen ? '<div class="empty">No templates yet. Create one to speed up logging.</div>' : '');

      el.innerHTML = `
        <div class="tmpl-header-row">
          <h2>Templates</h2>
          ${!builderOpen ? `<button class="add-set-btn" style="width:auto;padding:0.3rem 0.85rem" onclick="toggleTemplateBuilder()">+ New Template</button>` : ''}
        </div>
        ${builderHtml}
        ${listHtml}`;

      if (builderOpen) renderBuilderList();
    }

    // ── Stats ─────────────────────────────────────────────────────────────────

    function getWeekBounds() {
      const now   = new Date();
      const day   = now.getDay(); // 0=Sun
      const mon   = new Date(now);
      mon.setDate(now.getDate() - ((day + 6) % 7));
      mon.setHours(0, 0, 0, 0);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      sun.setHours(23, 59, 59, 999);
      return { start: mon, end: sun };
    }

    function categoryFor(exercise) {
      for (const cat of EXERCISE_CATEGORIES) {
        if (cat.exercises.includes(exercise)) return cat.label;
        if (customExercises.includes(exercise)) return 'Custom';
      }
      return 'Other';
    }

    function calcWeeklyVolume() {
      const { start, end } = getWeekBounds();
      const entries = load().filter(e =>
        !e.cardio && e.ts >= start.getTime() && e.ts <= end.getTime()
      );
      const vol = new Map();
      for (const e of entries) {
        const cat = categoryFor(e.exercise);
        const ne  = normalizeEntry(e);
        let v = vol.get(cat) || 0;
        for (const s of ne.sets) {
          if (s.weight && s.reps) v += s.reps * s.weight;
        }
        vol.set(cat, v);
      }
      return vol;
    }

    function isoDay(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function calcStreaks() {
      const entries = load();
      const days = new Set(entries.map(e => isoDay(e.ts)));
      if (!days.size) return { current: 0, longest: 0 };

      const sorted = [...days].sort(); // ISO sort is lexicographically correct
      let longest = 1, run = 1;
      for (let i = 1; i < sorted.length; i++) {
        const prev = new Date(sorted[i - 1] + 'T12:00:00');
        prev.setDate(prev.getDate() + 1);
        if (isoDay(prev) === sorted[i]) {
          run++;
          if (run > longest) longest = run;
        } else {
          run = 1;
        }
      }

      // current streak: count back from today
      let current = 0;
      const d = new Date();
      while (true) {
        const k = isoDay(d);
        if (!days.has(k)) break;
        current++;
        d.setDate(d.getDate() - 1);
      }

      return { current, longest: Math.max(longest, current) };
    }

    function buildActivityCalendar() {
      const days  = new Set(load().map(e => isoDay(e.ts)));
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Start from Mon 13 weeks ago
      const startDay = new Date(today);
      const dow = (today.getDay() + 6) % 7; // 0=Mon
      startDay.setDate(today.getDate() - dow - 12 * 7);

      const dows = ['M','T','W','T','F','S','S'];
      let html = '<div class="activity-cal">';
      html += '<div class="activity-dow">' + dows.map(d => `<span>${d}</span>`).join('') + '</div>';
      html += '<div class="activity-grid">';

      const cursor = new Date(startDay);
      for (let i = 0; i < 13 * 7; i++) {
        const k = isoDay(cursor);
        const isToday  = cursor.getTime() === today.getTime();
        const isFuture = cursor > today;
        const isOn     = days.has(k);
        let cls = 'ac';
        if (isToday)       cls += ' ac-today';
        else if (isFuture) cls += ' ac-future';
        else if (isOn)     cls += ' ac-on';
        html += `<div class="${cls}" title="${k}"></div>`;
        cursor.setDate(cursor.getDate() + 1);
      }

      html += '</div></div>';
      return html;
    }

    function renderStatsCard() {
      const el = document.getElementById('stats-content');
      if (!el) return;

      const vol     = calcWeeklyVolume();
      const streaks = calcStreaks();
      const { start, end } = getWeekBounds();
      const fmt = d => d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      const weekLabel = `${fmt(start)} – ${fmt(end)}`;

      // Volume bars
      const maxVol = Math.max(...vol.values(), 1);
      // Filter to strength-only categories and sort by volume desc
      const catOrder = EXERCISE_CATEGORIES.filter(c => c.label !== 'Cardio').map(c => c.label);
      const volRows = catOrder
        .filter(cat => vol.has(cat))
        .sort((a, b) => (vol.get(b) || 0) - (vol.get(a) || 0))
        .map(cat => {
          const v   = vol.get(cat) || 0;
          const pct = Math.round((v / maxVol) * 100);
          const disp = unit === 'lbs'
            ? Math.round(v * 2.20462).toLocaleString() + ' lbs'
            : Math.round(v).toLocaleString() + ' kg';
          return `<div class="vol-row">
            <span class="vol-label">${escHtml(cat)}</span>
            <div class="vol-bar-wrap"><div class="vol-bar" style="width:${pct}%"></div></div>
            <span class="vol-val">${disp}</span>
          </div>`;
        }).join('');

      el.innerHTML = `
        <div class="stat-group">
          <div class="stat-group-title">Weekly Volume <span class="stat-week-label">${weekLabel}</span></div>
          ${volRows || '<div class="empty" style="margin:0.5rem 0">No strength entries this week.</div>'}
        </div>
        <div class="stat-group">
          <div class="stat-group-title">Streak</div>
          <div class="streak-row">
            <div class="streak-box">
              <div class="streak-num">${streaks.current}</div>
              <div class="streak-lbl">Current</div>
            </div>
            <div class="streak-box">
              <div class="streak-num">${streaks.longest}</div>
              <div class="streak-lbl">Longest</div>
            </div>
          </div>
        </div>
        <div class="stat-group">
          <div class="stat-group-title">Activity (13 weeks)</div>
          ${buildActivityCalendar()}
        </div>`;
    }

    // ── Init ──────────────────────────────────────────────────────────────────

    document.getElementById('today-date').textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('btn-kg').classList.toggle('active', unit === 'kg');
    document.getElementById('btn-lbs').classList.toggle('active', unit === 'lbs');

    applyTheme(themeVarsFor(currentTheme));
    renderThemeCard();
    renderFormSection();
    renderBWSection();
    renderTemplatesCard();
    render();
    updateStats();
  </script>
</body>
</html>
